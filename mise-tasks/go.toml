# Go tasks, included from mise.toml [task_config]. ~keep

# The caller's TSLP_LINK_MODE and TSLP_LANGUAGES win over these defaults. ~keep
["go:build:ffi"]
description = "Build FFI static library for Go"
run = 'TSLP_LINK_MODE="${TSLP_LINK_MODE:-static}" TSLP_LANGUAGES="${TSLP_LANGUAGES:-{{vars.ffi_test_languages}}}" cargo build --locked -p ts-pack-core-ffi --release'

["go:test"]
description = "Run Go unit tests"
depends = ["go:build:ffi"]
dir = "{{config_root}}/packages/go"
run = "go test -v ./..."

["go:lint"]
description = "Lint and vet Go code (requires FFI built first)"
depends = ["go:build:ffi"]
dir = "{{config_root}}/packages/go"
run = "go vet ./..."

["go:format:check"]
description = "Check Go formatting"
dir = "{{config_root}}/packages/go"
run = 'test -z "$(gofmt -l .)"'

["go:update"]
description = "Update Go dependencies within current major versions (non-breaking)"
dir = "{{config_root}}/packages/go"
run = [
  "go get -t ./...",
  "go mod tidy",
  "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest || true",
]

["go:upgrade"]
description = "Upgrade Go dependencies to latest versions (cross-major / breaking)"
dir = "{{config_root}}/packages/go"
run = [
  "go get -u -t ./...",
  "go mod tidy",
  "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest || true",
]

["go:e2e:generate"]
description = "Generate Go E2E tests from fixtures"
run = ["alef e2e generate --lang go", "gofmt -w e2e/go/"]

["go:e2e:test"]
description = "Run Go E2E tests"
run = "alef test --lang go --e2e --jobs 1"
