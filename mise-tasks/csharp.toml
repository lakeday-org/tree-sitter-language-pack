# C# tasks, included from mise.toml [task_config]. The library project has no test adapter:
# `dotnet test` against it reports "All projects are up-to-date for restore", runs zero tests and
# exits 0, so the test tasks target the smoke-test project, which actually asserts. ~keep

["csharp:build:ffi"]
description = "Build FFI shared library for C#"
run = [{ task = "ffi:build" }]

["csharp:build"]
description = "Build FFI library and C# package"
depends = ["csharp:build:ffi"]
dir = "{{config_root}}/packages/csharp"
run = "dotnet build {{vars.csharp_project}} -c Release"

["csharp:build:ci"]
description = "Build C# package (CI, FFI already built)"
dir = "{{config_root}}/packages/csharp"
run = "dotnet build {{vars.csharp_project}} -c Release"

["csharp:test"]
description = "Run C# tests (requires FFI built first)"
depends = ["csharp:build:ffi"]
dir = "{{config_root}}/packages/csharp"
run = '''LD_LIBRARY_PATH="$PROJECT_ROOT/target/release:${LD_LIBRARY_PATH:-}" DYLD_LIBRARY_PATH="$PROJECT_ROOT/target/release:${DYLD_LIBRARY_PATH:-}" dotnet test {{vars.csharp_smoke_project}} -c Release'''

["csharp:test:ci"]
description = "Run C# tests (CI, FFI already available)"
dir = "{{config_root}}/packages/csharp"
run = "dotnet test {{vars.csharp_smoke_project}} -c Release"

["csharp:package"]
description = "Create NuGet package"
depends = ["csharp:build"]
dir = "{{config_root}}/packages/csharp"
run = "dotnet pack {{vars.csharp_project}} -c Release"

["csharp:lint"]
description = "Lint C# code"
dir = "{{config_root}}/packages/csharp"
run = "dotnet build {{vars.csharp_project}} -c Release -warnaserror"

["csharp:format"]
description = "Format C# code"
dir = "{{config_root}}/packages/csharp"
run = "dotnet format {{vars.csharp_project}}"

["csharp:format:check"]
description = "Check C# formatting (CI)"
dir = "{{config_root}}/packages/csharp"
run = "dotnet format {{vars.csharp_project}} --verify-no-changes"

["csharp:lint:check"]
description = "Check C# linting without modifications (CI)"
dir = "{{config_root}}/packages/csharp"
run = "dotnet build {{vars.csharp_project}} -c Release -warnaserror"

["csharp:update"]
description = "Update C# dependencies within current major versions (non-breaking)"
dir = "{{config_root}}/packages/csharp"
run = [
  "dotnet tool install --global dotnet-outdated-tool || dotnet tool update --global dotnet-outdated-tool",
  "dotnet outdated {{vars.csharp_project}} --upgrade --version-lock Major",
  "dotnet list {{vars.csharp_project}} package --outdated || true",
]

["csharp:upgrade"]
description = "Upgrade C# dependencies to latest versions (cross-major / breaking)"
dir = "{{config_root}}/packages/csharp"
run = [
  "dotnet tool install --global dotnet-outdated-tool || dotnet tool update --global dotnet-outdated-tool",
  "dotnet outdated {{vars.csharp_project}} --upgrade",
  "dotnet list {{vars.csharp_project}} package --outdated || true",
]

["csharp:clean"]
description = "Clean C# build artifacts"
dir = "{{config_root}}/packages/csharp"
run = ["dotnet clean {{vars.csharp_project}} -c Release", "dotnet clean {{vars.csharp_project}} -c Debug"]

["csharp:e2e:generate"]
description = "Generate C# E2E tests from fixtures"
run = "alef e2e generate --lang csharp"

["csharp:e2e:test"]
description = "Run C# E2E tests"
run = "alef test --lang csharp --e2e --jobs 1"
