# Python tasks, included from mise.toml [task_config]. ~keep

["python:install"]
description = "Install Python dependencies via uv"
run = [
  "python3 --version",
  "uv --version",
  "uv sync --no-install-project --group doc",
  # ~keep packages/python is not a root uv workspace member, so `uv sync` never installs its
  # own dependencies (tree-sitter) and pyrefly cannot resolve them. CI covers this with
  # reusable-validate's `python-extra-projects: packages/python`; this keeps `poly lint`
  # locally in step with CI instead of failing only on developer machines.
  "uv pip install -e packages/python",
]

["python:format"]
description = "Format Python code"
run = ["uv run --no-sync ruff format", "uv run --no-sync ruff check --fix --unsafe-fixes"]

["python:format:check"]
description = "Check Python formatting (CI)"
run = ["uv run --no-sync ruff format --check", "uv run --no-sync ruff check"]

["python:lint"]
description = "Lint Python code"
run = ["uv run --no-sync ruff check --fix --unsafe-fixes", "uv run --no-sync ruff format"]

["python:lint:check"]
description = "Check Python linting without modifications"
run = "uv run --no-sync ruff check"

["python:clean"]
description = "Clean Python build artifacts"
run = "rm -rf build/ dist/ *.egg-info __pycache__"

["python:update"]
description = "Update Python dependencies within current major versions (non-breaking)"
run = [
  "uv sync --all-packages --all-extras --no-install-workspace --no-install-project",
  "uv pip list --outdated || true",
]

["python:upgrade"]
description = "Upgrade Python dependencies to latest versions (cross-major / breaking)"
run = [
  "uv sync --all-packages --all-extras --upgrade --no-install-workspace --no-install-project",
  "uv pip list --outdated || true",
]

["python:e2e:generate"]
description = "Generate Python E2E tests from fixtures"
run = "alef e2e generate --lang python"

["python:e2e:test"]
description = "Run Python E2E tests"
run = "alef test --lang python --e2e --jobs 1"

["python:e2e:verify"]
description = "Full Python E2E pipeline (generate + test)"
run = [{ task = "python:e2e:generate" }, { task = "python:e2e:test" }]
