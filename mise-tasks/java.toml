# Java tasks, included from mise.toml [task_config]. ~keep

["java:deps"]
description = "Resolve Java/Maven dependencies"
dir = "{{config_root}}/packages/java"
run = "mvn dependency:resolve -q"

["java:build:ffi"]
description = "Build FFI shared library for Java"
run = [{ task = "ffi:build" }]

["java:build"]
description = "Build FFI library and Java package"
depends = ["java:build:ffi"]
dir = "{{config_root}}/packages/java"
run = "mvn package -DskipTests -q"

["java:test"]
description = "Run Java tests (requires FFI built first)"
depends = ["java:build:ffi"]
dir = "{{config_root}}/packages/java"
run = "mvn test"

["java:format"]
description = "Format Java code"
dir = "{{config_root}}/packages/java"
run = "mvn com.spotify.fmt:fmt-maven-plugin:format"

["java:format:check"]
description = "Check Java formatting (CI)"
dir = "{{config_root}}/packages/java"
run = "mvn com.spotify.fmt:fmt-maven-plugin:check"

["java:lint"]
description = "Lint Java code"
dir = "{{config_root}}/packages/java"
run = "mvn com.spotify.fmt:fmt-maven-plugin:check"

["java:lint:check"]
description = "Check Java linting without modifications (CI)"
dir = "{{config_root}}/packages/java"
run = "mvn com.spotify.fmt:fmt-maven-plugin:check"

["java:update"]
description = "Update Java dependencies within current major versions (non-breaking)"
run = [{ task = "java:refresh update" }]

["java:upgrade"]
description = "Upgrade Java dependencies to latest versions (cross-major / breaking)"
run = [{ task = "java:refresh upgrade" }]

["java:clean"]
description = "Clean Java build artifacts"
dir = "{{config_root}}/packages/java"
run = "mvn clean -q"

["java:e2e:generate"]
description = "Generate Java E2E tests from fixtures"
run = "alef e2e generate --lang java"

["java:e2e:test"]
description = "Run Java E2E tests"
run = ["python3 scripts/ci/build_libtree_sitter.py", "alef test --lang java --e2e --jobs 1"]
