# Dart tasks, included from mise.toml [task_config]. Dart is not a mise tool, so each task that
# needs it fails first when `dart` is missing. ~keep

["dart:install"]
description = "Install Dart dependencies"
dir = "{{config_root}}/packages/dart"
run = ["command -v dart >/dev/null 2>&1", "dart pub get"]

["dart:setup"]
description = "Setup Dart environment + flutter_rust_bridge_codegen"
run = [
  "command -v flutter_rust_bridge_codegen >/dev/null 2>&1 || cargo install --locked flutter_rust_bridge_codegen --version 2.12.0",
  { task = "dart:install" },
]

["dart:build"]
description = "Build Dart package against flutter_rust_bridge Rust crate"
run = [{ task = "dart:compile release" }]

["dart:build:dev"]
description = "Build Dart package in debug mode"
run = [{ task = "dart:compile dev" }]

["dart:build:release"]
description = "Build Dart package in release mode (alias for build)"
run = [{ task = "dart:build" }]

["dart:test"]
description = "Run Dart tests"
dir = "{{config_root}}/packages/dart"
env = { DYLD_FALLBACK_LIBRARY_PATH = "{{config_root}}/target/release", LD_LIBRARY_PATH = "{{config_root}}/target/release", FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR = "{{config_root}}/target/release" }
run = ["command -v dart >/dev/null 2>&1", "dart pub get", "dart test"]

["dart:lint"]
description = "Format Dart code"
dir = "{{config_root}}/packages/dart"
run = ["command -v dart >/dev/null 2>&1", "dart format ."]

["dart:lint:check"]
description = "Check Dart code formatting"
dir = "{{config_root}}/packages/dart"
run = ["command -v dart >/dev/null 2>&1", "dart format . --set-exit-if-changed"]

["dart:format"]
description = "Format Dart code (alias for lint)"
run = [{ task = "dart:lint" }]

["dart:format:check"]
description = "Check Dart formatting (alias for lint:check)"
run = [{ task = "dart:lint:check" }]

["dart:clean"]
description = "Clean Dart build artifacts"
dir = "{{config_root}}/packages/dart"
run = "rm -rf .dart_tool build pubspec.lock"

["dart:update"]
description = "Update Dart dependencies within current major versions (non-breaking)"
run = ["command -v dart >/dev/null 2>&1", "mise run deps update dart"]

["dart:upgrade"]
description = "Upgrade Dart dependencies to latest versions (cross-major / breaking)"
run = ["command -v dart >/dev/null 2>&1", "mise run deps upgrade dart"]

["dart:e2e:test"]
description = "Run Dart e2e tests"
env = { DYLD_FALLBACK_LIBRARY_PATH = "{{config_root}}/target/release", LD_LIBRARY_PATH = "{{config_root}}/target/release", FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR = "{{config_root}}/target/release" }
run = [
  "command -v dart >/dev/null 2>&1",
  "TSLP_LINK_MODE=static TSLP_LANGUAGES=mojo,nim,norg cargo build --release --locked -p tree-sitter-language-pack-dart",
  "cd e2e/dart && dart pub get && dart test",
]
