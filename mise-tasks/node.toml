# Node.js tasks, included from mise.toml [task_config]. ~keep

["node:deps"]
description = "Install Node.js dependencies"
dir = "{{config_root}}/crates/ts-pack-core-node"
run = "pnpm install"

["node:update"]
description = "Update Node/TypeScript dependencies within current major versions (non-breaking)"
run = ["pnpm up -r", "pnpm up -w"]

["node:upgrade"]
description = "Upgrade Node/TypeScript dependencies to latest versions (cross-major / breaking)"
run = ["pnpm up --latest -r", "pnpm up --latest -w"]

["node:build"]
description = "Build NAPI-RS native module (release)"
dir = "{{config_root}}/crates/ts-pack-core-node"
run = "napi build --release"

["node:build:dev"]
description = "Build NAPI-RS native module (debug)"
dir = "{{config_root}}/crates/ts-pack-core-node"
run = "napi build"

["node:test"]
description = "Smoke test Node.js native module"
dir = "{{config_root}}/crates/ts-pack-core-node"
run = '''node -e "const m = require('./'); console.log('Languages:', m.availableLanguages().length)"'''

["node:lint"]
description = "Lint TypeScript/JavaScript code"
run = "poly lint crates/ts-pack-core-node"

["node:lint:check"]
description = "Check TypeScript/JavaScript linting (CI)"
run = "poly lint crates/ts-pack-core-node"

["node:format"]
description = "Format TypeScript/JavaScript code"
run = "poly fmt --fix crates/ts-pack-core-node"

["node:format:check"]
description = "Check TypeScript/JavaScript formatting (CI)"
run = "poly fmt --check crates/ts-pack-core-node"

["node:clean"]
description = "Clean Node.js build artifacts"
dir = "{{config_root}}/crates/ts-pack-core-node"
run = "rm -f *.node"

["node:e2e:generate"]
description = "Generate TypeScript/Node E2E tests from fixtures"
run = "alef e2e generate --lang node"

["node:e2e:test"]
description = "Run TypeScript/Node E2E tests"
run = "alef test --lang node --e2e --jobs 1"
