# Documentation tasks, included from mise.toml [task_config]. ~keep

["docs:build"]
description = "Build documentation"
run = ["pnpm --dir docs-site install --frozen-lockfile", "pnpm --dir docs-site build"]

["docs:build:strict"]
description = "Build documentation (CI-equivalent; astro build fails on errors)"
run = [{ task = "docs:build" }]

["docs:serve"]
description = "Serve documentation locally with live reload"
run = ["pnpm --dir docs-site install", "pnpm --dir docs-site dev"]

["docs:lint:links"]
description = "Check links with lychee"
run = [
  { task = "docs:build" },
  'lychee --offline --config .lychee.toml --root-dir "{{config_root}}/docs-site/dist" docs-site/dist README.md',
]

["docs:lint:prose"]
description = "Lint prose with textlint"
run = "npx textlint 'docs-site/src/content/docs/**/*.{md,mdx}'"

["docs:snippets:list"]
description = "List all documentation snippets discovered by alef"
run = "alef snippets list --snippets docs-site/src/snippets"

["docs:snippets:list:lang"]
description = "List snippets filtered to specific languages (rust,python)"
usage = 'arg "<languages>" help="Comma-separated snippet languages"'
run = 'alef snippets list --snippets docs-site/src/snippets --languages "$usage_languages"'

["docs:snippets:validate"]
description = "Validate all documentation snippets with fixture coverage parity"
run = "alef snippets check --strict --cache off"

["docs:snippets:validate:lang"]
description = "Validate snippets for specific languages (rust,python)"
usage = 'arg "<languages>" help="Comma-separated snippet languages"'
run = 'alef snippets check --strict --cache off --lang "$usage_languages"'

["docs:snippets:gaps"]
description = "Report unreferenced snippets + missing language variants"
run = "alef snippets gaps --snippets docs-site/src/snippets --docs docs-site/src/content/docs"

["docs:snippets:audit"]
description = "Audit snippet structure under docs-site/src/snippets"
run = "alef snippets audit --snippets docs-site/src/snippets"

["docs:snippets:all"]
description = "Generate and strictly validate fixture-driven documentation snippets"
run = ["alef e2e generate", "alef snippets check --strict --cache off"]

["docs:generate:languages"]
description = "Generate supported languages documentation from language_definitions.json"
sources = ["sources/language_definitions.json"]
outputs = ["docs-site/src/content/docs/languages.md"]
run = "uv run --no-sync scripts/generate_grammar_table.py"

["docs:generate:grammar-table"]
description = "Generate the per-grammar query-bundle README partial"
sources = ["sources/language_definitions.json", "parsers/*/queries/*.scm"]
outputs = ["templates/readme/partials/grammar_table.md"]
run = "uv run --no-sync scripts/generate_grammar_table.py --mode queries --output templates/readme/partials/grammar_table.md"

["docs:generate:api"]
description = "Generate API reference docs (via alef)"
run = "alef docs"
