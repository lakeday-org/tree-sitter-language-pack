# PHP tasks, included from mise.toml [task_config]. ~keep

["php:build"]
description = "Build PHP extension (requires php-config)"
run = "cargo build --release --locked --manifest-path crates/ts-pack-core-php/Cargo.toml"

["php:build:dev"]
description = "Build PHP extension in debug mode"
run = "cargo build --locked --manifest-path crates/ts-pack-core-php/Cargo.toml"

["php:test"]
description = "Run PHP smoke test"
run = "php examples/php_smoke/convert.php"

["php:format"]
description = "Format PHP code"
run = "poly fmt --fix packages/php"

["php:format:check"]
description = "Check PHP formatting (CI)"
run = "poly fmt --check packages/php"

["php:lint"]
description = "Lint PHP code"
run = "poly lint packages/php"

["php:lint:check"]
description = "Check PHP linting without modifications (CI)"
run = "poly lint packages/php"

["php:clean"]
description = "Clean PHP build artifacts"
run = "rm -rf crates/ts-pack-core-php/vendor crates/ts-pack-core-php/target"

["php:update"]
description = "Update PHP dependencies within current major versions (non-breaking)"
run = [
  "composer update -w || true",
  "composer outdated --direct || true",
  "cd e2e/php && composer update -w || true",
  "cd e2e/php && composer outdated --direct || true",
]

["php:upgrade"]
description = "Upgrade PHP dependencies to latest versions (cross-major / breaking)"
run = [
  "composer update --with-all-dependencies || true",
  "composer outdated --direct || true",
  "cd e2e/php && composer update --with-all-dependencies || true",
  "cd e2e/php && composer outdated --direct || true",
]

["php:e2e:generate"]
description = "Generate PHP E2E tests from fixtures"
run = "alef e2e generate --lang php"

["php:e2e:test"]
description = "Run PHP E2E tests"
run = "alef test --lang php --e2e --jobs 1"
