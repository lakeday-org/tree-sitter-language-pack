# Version tasks, included from mise.toml [task_config]. ~keep

["version:set"]
description = "Set an explicit release version and synchronize generated outputs"
usage = 'arg "<version>" help="Release version to set, e.g. 1.22.0"'
run = ['alef sync-versions --set "$usage_version"', { task = "version:sync" }]

["version:sync"]
description = "Synchronize version across all package manifests"
run = [
  "alef sync-versions",
  # Repin the registry-mode test apps. `alef sync-versions` reaches five of them
  # (dart, elixir, kotlin_android, swift_e2e, php) through its catch-all branch, which
  # refuses to rewrite a file carrying no alef provenance marker and only WARNs -- so
  # those pins silently stayed up to six releases behind. This owns them locally. ~keep
  "python3 scripts/check_test_app_pins.py --fix",
  # ~keep `alef sync-versions` rewrites the workspace package.json files but not
  # pnpm-lock.yaml, so the lockfile keeps the previous release's version specifiers and
  # every `pnpm install --frozen-lockfile` fails until someone refreshes it by hand --
  # 1.18.0 and 1.19.0 each needed a follow-up commit for exactly this. The workspace
  # entries are `link:` deps, so this resolves offline and touches only those specifiers.
  "pnpm install --lockfile-only",
  { task = "alef:regenerate" },
  # Sync the coding-agent plugin: pin plugin/.ai-rulez/config.plugins.toml [plugin].version
  # to core, then regenerate the per-runtime bundles under plugin/ from it. ~keep
  "python3 scripts/sync_plugin_version.py",
  "ai-rulez generate --plugin",
  { task = "alef:verify:strict" },
]
